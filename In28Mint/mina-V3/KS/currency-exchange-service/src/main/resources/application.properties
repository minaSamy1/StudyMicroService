spring.application.name=currency-exchange

server.port=8000

spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.defer-datasource-initialization=true # For >2.5.0  mean run the .sql scripts after DB run

## Eurka naming-server Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.lease-renewal-interval-in-seconds=0

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


##  retry configuration
resilience4j.retry.instances.sample-api.maxAttempts=5
##between each try wait 2 second
resilience4j.retry.instances.sample-api.waitDuration=1s
resilience4j.retry.instances.sample-api.enableExponentialBackoff=true


## RateLimiter Configuration
resilience4j.ratelimiter.instances.default.limitForPeriod=2
resilience4j.ratelimiter.instances.default.limitRefreshPeriod=10s

## bulkhead Configuration
resilience4j.bulkhead.instances.default.maxConcurrentCalls=4
resilience4j.bulkhead.instances.default.queueCapacity=0

## circuitbreaker Configuration
resilience4j.circuitbreaker.instances.default.failureRateThreshold=90


management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
